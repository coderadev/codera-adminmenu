<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Admin Menu</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

  <div id="app" class="hidden">
    <div class="frame">

      <header class="titlebar">
        <div class="titlebar__text">
          <h1>ADMIN</h1>
          <span id="viewLabel">ALL COMMANDS</span>
        </div>
      </header>

      <div class="body-row">
        <aside class="sidebar">
          <button class="nav-item is-active" data-cat="all">
            <span class="nav-item__icon">
              <svg viewBox="0 0 24 24"><rect width="24" height="24" rx="2" fill="#e5e5e5"/><path d="M5 8.2l4.2 3.6L5 15.4" fill="none" stroke="#0b0f12" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M11.2 16.2h6" fill="none" stroke="#0b0f12" stroke-width="1.7" stroke-linecap="round"/></svg>
            </span>
            <span>ALL</span>
          </button>
          <button class="nav-item" data-cat="players">
            <span class="nav-item__icon">
              <svg viewBox="0 0 640 512" fill="currentColor"><path d="M96 224c35.3 0 64-28.7 64-64s-28.7-64-64-64-64 28.7-64 64 28.7 64 64 64zm448 0c35.3 0 64-28.7 64-64s-28.7-64-64-64-64 28.7-64 64 28.7 64 64 64zm32 32h-64c-17.6 0-33.5 7.1-45.1 18.6 40.3 22.1 68.9 62 75.1 109.4h66c17.7 0 32-14.3 32-32v-32c0-35.3-28.7-64-64-64zm-256 0c61.9 0 112-50.1 112-112S381.9 32 320 32 208 82.1 208 144s50.1 112 112 112zm76.8 32h-8.3c-20.8 10-43.9 16-68.5 16s-47.6-6-68.5-16h-8.3C179.6 288 128 339.6 128 403.2V432c0 26.5 21.5 48 48 48h288c26.5 0 48-21.5 48-48v-28.8c0-63.6-51.6-115.2-115.2-115.2zm-223.7-13.4C161.5 263.1 145.6 256 128 256H64c-35.3 0-64 28.7-64 64v32c0 17.7 14.3 32 32 32h65.9c6.3-47.4 34.9-87.3 75.2-109.4z"/></svg>
            </span>
            <span>PLAYERS</span>
          </button>
          <button class="nav-item" data-cat="economy">
            <span class="nav-item__icon">
              <svg viewBox="0 0 512 512" fill="currentColor"><path d="M256 8C119 8 8 119 8 256s111 248 248 248 248-111 248-248S393 8 256 8zm0 112c13.3 0 24 10.7 24 24v16h16c13.3 0 24 10.7 24 24s-10.7 24-24 24h-48c-8.8 0-16 7.2-16 16s7.2 16 16 16h32c35.3 0 64 28.7 64 64 0 30.9-22 56.7-51.2 62.7V392c0 13.3-10.7 24-24 24s-24-10.7-24-24v-16h-16c-13.3 0-24-10.7-24-24s10.7-24 24-24h48c8.8 0 16-7.2 16-16s-7.2-16-16-16h-32c-35.3 0-64-28.7-64-64 0-30.9 22-56.7 51.2-62.7V144c0-13.3 10.7-24 24-24z"/></svg>
            </span>
            <span>ECONOMY</span>
          </button>
          <button class="nav-item" data-cat="vehicles">
            <span class="nav-item__icon">
              <svg viewBox="0 0 512 512" fill="currentColor"><path d="M135.2 117.4L109.1 192h293.8l-26.1-74.6C372.3 104.6 360.2 96 346.6 96H165.4c-13.6 0-25.7 8.6-30.2 21.4zM39.6 196.8L74.8 96.3C88.3 57.8 124.6 32 165.4 32h181.2c40.8 0 77.1 25.8 90.6 64.3l35.2 100.5c23.2 9.6 39.6 32.5 39.6 59.2v192c0 17.7-14.3 32-32 32h-32c-17.7 0-32-14.3-32-32v-32H96v32c0 17.7-14.3 32-32 32H32c-17.7 0-32-14.3-32-32V256c0-26.7 16.4-49.6 39.6-59.2zM128 288c0-17.7-14.3-32-32-32s-32 14.3-32 32 14.3 32 32 32 32-14.3 32-32zm288 32c17.7 0 32-14.3 32-32s-14.3-32-32-32-32 14.3-32 32 14.3 32 32 32z"/></svg>
            </span>
            <span>VEHICLES</span>
          </button>
          <button class="nav-item" data-cat="teleport">
            <span class="nav-item__icon">
              <svg viewBox="0 0 384 512" fill="currentColor"><path d="M172.3 501.7C27 291 0 269.4 0 192 0 86 86 0 192 0s192 86 192 192c0 77.4-27 99-172.3 309.7-9.5 13.8-29.9 13.8-39.5 0zM192 272c44.2 0 80-35.8 80-80s-35.8-80-80-80-80 35.8-80 80 35.8 80 80 80z"/></svg>
            </span>
            <span>TELEPORT</span>
          </button>
          <button class="nav-item" data-cat="utility">
            <span class="nav-item__icon">
              <svg viewBox="0 0 512 512" fill="currentColor"><path d="M487.4 315.7l-42.6-24.6c4.3-23.2 4.3-47 0-70.2l42.6-24.6c4.9-2.8 7.1-8.6 5.5-14-11.1-35.6-30-67.8-54.7-94.6-3.8-4.1-10-5.1-14.8-2.3L380.8 110c-17.9-15.4-38.5-27.3-60.8-35.1V25.8c0-5.6-3.9-10.5-9.4-11.7-36.7-8.2-74.3-7.8-109.2 0-5.5 1.2-9.4 6.1-9.4 11.7V75c-22.2 7.9-42.8 19.8-60.8 35.1L88.7 85.5c-4.9-2.8-11-1.9-14.8 2.3-24.7 26.7-43.6 58.9-54.7 94.6-1.7 5.4.6 11.2 5.5 14L67.3 221c-4.3 23.2-4.3 47 0 70.2l-42.6 24.6c-4.9 2.8-7.1 8.6-5.5 14 11.1 35.6 30 67.8 54.7 94.6 3.8 4.1 10 5.1 14.8 2.3l42.6-24.6c17.9 15.4 38.5 27.3 60.8 35.1v49.2c0 5.6 3.9 10.5 9.4 11.7 36.7 8.2 74.3 7.8 109.2 0 5.5-1.2 9.4-6.1 9.4-11.7v-49.2c22.2-7.9 42.8-19.8 60.8-35.1l42.6 24.6c4.9 2.8 11 1.9 14.8-2.3 24.7-26.7 43.6-58.9 54.7-94.6 1.5-5.5-.7-11.3-5.6-14.1zM256 336c-44.1 0-80-35.9-80-80s35.9-80 80-80 80 35.9 80 80-35.9 80-80 80z"/></svg>
            </span>
            <span>UTILITY</span>
          </button>
          <button class="nav-item" data-cat="user">
            <span class="nav-item__icon">
              <svg viewBox="0 0 448 512" fill="currentColor"><path d="M224 256c70.7 0 128-57.3 128-128S294.7 0 224 0 96 57.3 96 128s57.3 128 128 128zm89.6 32h-16.7c-22.2 10.2-46.9 16-72.9 16s-50.6-5.8-72.9-16h-16.7C60.2 288 0 348.2 0 422.4V464c0 26.5 21.5 48 48 48h352c26.5 0 48-21.5 48-48v-41.6c0-74.2-60.2-134.4-134.4-134.4z"/></svg>
            </span>
            <span>USER</span>
          </button>
        </aside>

        <main class="main">
          <div class="searchbar">
            <input id="search" type="text" placeholder="Search commands..." autocomplete="off" />
          </div>
          <div class="countline"><span id="count">0</span> COMMANDS</div>

          <div class="list" id="list"></div>
        </main>
      </div>

      <footer class="footbar">
        <div class="footbar__hints">
          <div class="hint"><span class="key">+</span> MOVE</div>
          <div class="hint"><span class="key">&#9166;</span> SELECT</div>
          <div class="hint"><span class="key">F</span> FAVOURITE</div>
          <div class="hint"><span class="key">Q</span> CATEGORY</div>
          <div class="hint"><span class="key">X</span> LAYOUT</div>
          <div class="hint"><span class="key">ESC</span> CLOSE</div>
        </div>
      </footer>

    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
